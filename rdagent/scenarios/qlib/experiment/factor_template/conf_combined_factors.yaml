qlib_init:
    provider_uri: "{{ provider_uri | default('~/.qlib/qlib_data/cn_data', true) }}"
    region: {{ region | default('cn', true) }}

market: &market {{ market | default('csi300', true) }}
benchmark: &benchmark {{ benchmark | default('SH000300', true) }}

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2008-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.Alpha158DL
                  kwargs:
                    freq: {{ qlib_freq | default('day', true) }}
                    config:
                        label: 
                            - ["{{ label_expression | default('Ref($close, -2)/Ref($close, -1) - 1', true) }}"]
                            - ["LABEL0"]
                        feature:
                            - {{ feature_expressions }}
                            - {{ feature_names }}
                - class: qlib.data.dataset.loader.StaticDataLoader
                  kwargs:
                    config: "combined_factors_df.parquet"

    learn_processors:
        - class: DropnaLabel
        {% if n_instruments | default(2) | int >= 2 %}
        - class: CSZScoreNorm
          kwargs:
              fields_group: label
        {% endif %}

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: {{ topk | default(50, true) }}
            n_drop: {{ n_drop | default(5, true) }}
    backtest:
        start_time: {{ test_start | default("2017-01-01", true) }}
        end_time: {{ test_end | default("null", true) }}
        account: {{ account | default(100000000, true) }}
        benchmark: *benchmark
        exchange_kwargs:
            freq: {{ qlib_freq | default('day', true) }}
            limit_threshold: {{ limit_threshold | default(0.095, true) }}
            deal_price: close
            open_cost: {{ open_cost | default(0.0005, true) }}
            close_cost: {{ close_cost | default(0.0015, true) }}
            min_cost: {{ min_cost | default(5, true) }}
            trade_unit: {{ trade_unit | default(100, true) }}
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: {{ qlib_freq | default('day', true) }}
            generate_portfolio_metrics: true

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: {{ lgb_colsample | default(0.8879, true) }}
            learning_rate: {{ lgb_learning_rate | default(0.2, true) }}
            subsample: {{ lgb_subsample | default(0.8789, true) }}
            lambda_l1: {{ lgb_lambda_l1 | default(205.6999, true) }}
            lambda_l2: {{ lgb_lambda_l2 | default(580.9768, true) }}
            max_depth: {{ lgb_max_depth | default(8, true) }}
            num_leaves: {{ lgb_num_leaves | default(210, true) }}
            num_threads: {{ lgb_num_threads | default(20, true) }}
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2008-01-01", true) }}, {{ train_end | default("2014-12-31", true) }}]
                valid: [{{ valid_start | default("2015-01-01", true) }}, {{ valid_end | default("2016-12-31", true) }}]
                test: [{{ test_start | default("2017-01-01", true) }}, {{ test_end | default("null", true) }}]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: True
            ann_scaler: {{ ann_scaler | default(252, true) }}
        {% if n_instruments | default(2) | int >= 2 %}
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
        {% endif %}
